[project]
name = "living-knowledge-poc-backend"
version = "0.1.0"
description = "FastAPI backend for the Living Knowledge POC Phase 1 bootstrap."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "neo4j>=5.26.0,<6.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-ai>=2,<3",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pypdf>=6.0.0,<7.0.0",
    "python-docx>=1.2.0,<2.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require a local Neo4j instance",
]
